# UDDP microservices infrastructure (docs/msa-design.md).
#
#   docker compose up -d kafka kafka-init   Kafka for the services (single KRaft broker, dev only) and its topics
#   docker compose up -d postgres           the monolith's throwaway Postgres for the e2e scripts (profile "postgres")
#
# The four service databases (uddp_raw, uddp_identity, uddp_registry, uddp_platform) live in the developer's local
# PostgreSQL; run scripts/msa-db-setup.ps1 once to create the service roles and schemas. All Postgres settings come
# from the UDDP_POSTGRES_* environment variables; there are no defaults and no credentials in this file.
services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (scripts/msa-kafka-topics.sh), never by a typo in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MESSAGE_MAX_BYTES: 2097152
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - uddp-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/msa-kafka-topics.sh:/msa-kafka-topics.sh:ro
    entrypoint: ["/bin/bash", "/msa-kafka-topics.sh", "kafka:29092"]
    restart: "no"

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${UDDP_POSTGRES_DB:?Set UDDP_POSTGRES_DB}
      POSTGRES_USER: ${UDDP_POSTGRES_USER:?Set UDDP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UDDP_POSTGRES_PASSWORD:?Set UDDP_POSTGRES_PASSWORD}
    ports:
      - "${UDDP_POSTGRES_PORT:?Set UDDP_POSTGRES_PORT}:5432"
    volumes:
      - uddp-postgres-data:/var/lib/postgresql/data

volumes:
  uddp-kafka-data:
  uddp-postgres-data:
