# UDDP microservices infrastructure (docs/msa-design.md).
#
#   docker compose up -d kafka kafka-init   Kafka for the services (single KRaft broker, dev only) and its topics
#   docker compose --profile postgres up -d postgres
#                                           a PostgreSQL with the four service databases, roles and schemas
#                                           (deploy/postgres, run on its first start; profile "postgres")
#
# With an existing PostgreSQL instead, run the two deploy/postgres/*.sql files once with psql as a superuser. All
# Postgres settings come from the UDDP_POSTGRES_* environment variables (the service roles' password from
# UDDP_MSA_SERVICE_PASSWORD, else UDDP_POSTGRES_PASSWORD); there are no defaults and no credentials in this file.
services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (deploy/kafka/create-topics.sh), never by a typo in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MESSAGE_MAX_BYTES: 2097152
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - uddp-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./deploy/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh", "kafka:29092"]
    restart: "no"

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${UDDP_POSTGRES_DB:?Set UDDP_POSTGRES_DB}
      POSTGRES_USER: ${UDDP_POSTGRES_USER:?Set UDDP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UDDP_POSTGRES_PASSWORD:?Set UDDP_POSTGRES_PASSWORD}
      UDDP_MSA_SERVICE_PASSWORD: ${UDDP_MSA_SERVICE_PASSWORD:-${UDDP_POSTGRES_PASSWORD}}
    ports:
      - "${UDDP_POSTGRES_PORT:?Set UDDP_POSTGRES_PORT}:5432"
    volumes:
      - uddp-postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro

  # ---- Observability (profile "observability", docs/observability.md) ----------------------------------------------
  #   docker compose --profile observability up -d
  # Grafana http://localhost:3000 (dashboards in the UDDP folder), Prometheus http://localhost:9090. The services send
  # traces to http://localhost:4318 (OTLP) and write JSON logs to UDDP_LOG_DIR, which Alloy tails into Loki. Every
  # host port can be moved (UDDP_GRAFANA_PORT, UDDP_PROMETHEUS_PORT, UDDP_OTLP_PORT, UDDP_LOKI_PORT, UDDP_TEMPO_PORT,
# UDDP_ALERTMANAGER_PORT, UDDP_KAFKA_EXPORTER_PORT); Alertmanager http://localhost:9093;
  # with another OTLP port, set the services' UDDP_OTLP_TRACING_URL to match.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.4.2
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${UDDP_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - uddp-prometheus-data:/prometheus

  # Routes Prometheus alerts (deploy/observability/alertmanager.yml; by default it notifies no one).
  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "127.0.0.1:${UDDP_ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - uddp-alertmanager-data:/alertmanager

  # Consumer lag per group and topic offsets (dead-letter topics too), read from the broker for Prometheus.
  kafka-exporter:
    profiles: ["observability"]
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UDDP_KAFKA_EXPORTER_PORT:-9308}:9308"

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yml"]
    user: "0"
    ports:
      - "127.0.0.1:${UDDP_TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:${UDDP_OTLP_PORT:-4318}:4318"
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yml:ro
      - uddp-tempo-data:/var/tempo

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/loki.yml"]
    user: "0"
    ports:
      - "127.0.0.1:${UDDP_LOKI_PORT:-3100}:3100"
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/loki.yml:ro
      - uddp-loki-data:/loki

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.9.2
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    depends_on: [loki]
    volumes:
      - ./deploy/observability/alloy.config:/etc/alloy/config.alloy:ro
      # The folder the services write their JSON logs to (their UDDP_LOG_DIR).
      - ${UDDP_LOG_DIR:-./logs}:/var/log/uddp:ro

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.0.2
    depends_on: [prometheus, alertmanager, loki, tempo]
    environment:
      # Anyone on this machine may look; the admin password is Grafana's own first-login prompt (dev only).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    ports:
      - "127.0.0.1:${UDDP_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - uddp-grafana-data:/var/lib/grafana

volumes:
  uddp-kafka-data:
  uddp-postgres-data:
  uddp-prometheus-data:
  uddp-alertmanager-data:
  uddp-tempo-data:
  uddp-loki-data:
  uddp-grafana-data:
