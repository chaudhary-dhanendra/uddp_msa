# The UDDP service registry. A single standalone Eureka server for development; production runs two or more peers
# (set UDDP_EUREKA_URL on each to the other peers' /eureka/ addresses).
spring:
  application:
    name: discovery-service
server:
  port: ${UDDP_DISCOVERY_PORT:8761}
eureka:
  instance:
    hostname: ${UDDP_DISCOVERY_HOST:localhost}
  client:
    # A standalone registry neither registers with nor fetches from itself.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${UDDP_EUREKA_URL:http://${eureka.instance.hostname}:${server.port}/eureka/}
  server:
    # Development: no self-preservation, so stopped services leave the registry quickly.
    enable-self-preservation: ${UDDP_EUREKA_SELF_PRESERVATION:false}

# Observability (docs/observability.md): Prometheus metrics at /actuator/prometheus, traces over OTLP (Tempo), and
# structured JSON logs to a file when UDDP_LOG_DIR is set (collected into Loki).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${UDDP_TRACING_ENABLED:true}
    sampling:
      probability: ${UDDP_TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${UDDP_OTLP_TRACING_URL:http://127.0.0.1:4318/v1/traces}
logging:
  file:
    name: ${UDDP_LOG_DIR:target/logs}/${spring.application.name}.log
  structured:
    format:
      file: ecs
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
