spring:
  application:
    name: edge-service
  servlet:
    multipart:
      # The Studio enforces uddp.studio.upload-limit-bytes itself; this only bounds the request.
      max-file-size: 50MB
      max-request-size: 50MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
server:
  servlet:
    session:
      # Server-side sessions (ADR-0017): idle timeout, and a cookie scripts cannot read.
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        name: UDDP_SESSION
uddp:
  state-pack-directory: ../../services/statepack-service/seed/state-packs
  processing:
    # Rows per canonical-processing chunk (one transaction each); a failed run resumes after its last committed chunk.
    chunk-size: 5000
  platform-directory: ../../platform
  # Tracks A6/D2: model-assisted drafting is off unless enabled with a provider URL and model; the API key is read
  # from the environment variable named by api-key-env. Only GO text or masked column shapes are ever sent.
  # Track F: the LGD geography master is loaded only through the LGD adapter (a CSV or JSON snapshot file); empty means
  # no source. A master older than stale-after-hours is reported stale; the sync schedule is set through the API.
  geography:
    lgd:
      source-file: ""
      stale-after-hours: 720
      # Largest snapshot file an administrator may upload on the Geography master page.
      max-upload-mb: 50
  ai:
    enabled: false
    api-key-env: UDDP_AI_API_KEY
springdoc:
  api-docs:
    # OpenAPI 3.0: nullable values are marked nullable: true (see api/v1/RecordSchemaConverter).
    version: openapi_3_0
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
  paths-to-match: /api/**, /health
  swagger-ui:
    path: /swagger-ui.html

# Service discovery: register with the registry (discovery-service) and resolve lb:// addresses through it.
eureka:
  client:
    enabled: ${UDDP_EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${UDDP_EUREKA_URL:http://127.0.0.1:8761/eureka/}
  instance:
    prefer-ip-address: true

# Observability (docs/observability.md): Prometheus metrics at /actuator/prometheus, traces over OTLP (Tempo), and
# structured JSON logs to a file when UDDP_LOG_DIR is set (collected into Loki).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${UDDP_TRACING_ENABLED:true}
    sampling:
      probability: ${UDDP_TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${UDDP_OTLP_TRACING_URL:http://127.0.0.1:4318/v1/traces}
logging:
  file:
    name: ${UDDP_LOG_DIR:target/logs}/${spring.application.name}.log
  structured:
    format:
      file: ecs
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
