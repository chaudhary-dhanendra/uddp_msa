# Survivorship, Golden Resident and Golden Family lifecycle, provenance and lineage.
# Connection settings come only from the environment. The URL defaults to the local database uddp_registry on
# UDDP_POSTGRES_HOST/PORT, the user to the service role uddp_registry, and the password to UDDP_REGISTRY_POSTGRES_PASSWORD or,
# when that is unset, UDDP_POSTGRES_PASSWORD. Nothing here is a credential.
spring:
  application:
    name: registry-service
  datasource:
    url: ${UDDP_REGISTRY_POSTGRES_URL:jdbc:postgresql://${UDDP_POSTGRES_HOST:localhost}:${UDDP_POSTGRES_PORT:5432}/uddp_registry}
    username: ${UDDP_REGISTRY_POSTGRES_USER:uddp_registry}
    password: ${UDDP_REGISTRY_POSTGRES_PASSWORD:${UDDP_POSTGRES_PASSWORD:}}
    hikari:
      schema: registry
  flyway:
    # Own schema(s) and own history table; this service never touches another schema. Its own location, because the
    # monolith's jar (reused for the Golden engine) carries the monolith's migrations under db/migration.
    locations: classpath:db/registry
    schemas: registry,lineage
    default-schema: registry
    create-schemas: true
server:
  address: 127.0.0.1
  port: 8104
uddp:
  kafka:
    # Empty: no consumers and no relay (the service still serves its API). Set to enable messaging.
    bootstrap-servers: ${UDDP_KAFKA_BOOTSTRAP_SERVERS:}
  registry:
    # Platform survivorship policy (platform/survivorship/resident.yaml) and State Packs, until statepack-service
    # serves them by version and digest.
    platform-directory: ${UDDP_PLATFORM_DIRECTORY:../../platform}
    state-pack-directory: ${UDDP_STATE_PACK_DIRECTORY:../../services/statepack-service/seed/state-packs}
    build-wait: PT10M

# Service discovery: register with the registry (discovery-service) and resolve lb:// addresses through it.
eureka:
  client:
    enabled: ${UDDP_EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${UDDP_EUREKA_URL:http://127.0.0.1:8761/eureka/}
  instance:
    prefer-ip-address: true
    # The address other services reach this one at; the default suits one machine (services bind 127.0.0.1).
    # Each deployment sets UDDP_INSTANCE_ADDRESS to the host or pod address.
    ip-address: ${UDDP_INSTANCE_ADDRESS:127.0.0.1}

# Observability (docs/observability.md): Prometheus metrics at /actuator/prometheus, traces over OTLP (Tempo), and
# structured JSON logs to a file when UDDP_LOG_DIR is set (collected into Loki).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${UDDP_TRACING_ENABLED:true}
    sampling:
      probability: ${UDDP_TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${UDDP_OTLP_TRACING_URL:http://127.0.0.1:4318/v1/traces}
logging:
  file:
    name: ${UDDP_LOG_DIR:target/logs}/${spring.application.name}.log
  structured:
    format:
      file: ecs
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
