# Publishes, approves (maker-checker) and serves State Packs by version and digest.
# Connection settings come only from the environment. The URL defaults to the local database uddp_platform on
# UDDP_POSTGRES_HOST/PORT, the user to the service role uddp_statepack, and the password to UDDP_STATEPACK_POSTGRES_PASSWORD or,
# when that is unset, UDDP_POSTGRES_PASSWORD. Nothing here is a credential.
spring:
  application:
    name: statepack-service
  datasource:
    url: ${UDDP_STATEPACK_POSTGRES_URL:jdbc:postgresql://${UDDP_POSTGRES_HOST:localhost}:${UDDP_POSTGRES_PORT:5432}/uddp_platform}
    username: ${UDDP_STATEPACK_POSTGRES_USER:uddp_statepack}
    password: ${UDDP_STATEPACK_POSTGRES_PASSWORD:${UDDP_POSTGRES_PASSWORD:}}
    hikari:
      schema: statepack
  flyway:
    # Own location: in one JVM (the e2e test) every service's migrations are on the classpath.
    locations: classpath:db/statepack
    # Own schema(s) and own history table; this service never touches another schema.
    schemas: statepack
    default-schema: statepack
    create-schemas: true
server:
  address: 127.0.0.1
  port: 8105
management:
  endpoints:
    web:
      exposure:
        include: health,info
uddp:
  kafka:
    # Empty: no relay (the service still serves its API). Set to publish pack lifecycle events.
    bootstrap-servers: ${UDDP_KAFKA_BOOTSTRAP_SERVERS:}
  studio:
    # The Onboarding Studio hosted here: repository root (platform metadata, scheme catalogue), its workspace folder
    # (uploads, evidence) and its settings folder (encrypted preview connections). Maker-checker is on by default.
    repository-root: ${UDDP_REPOSITORY_ROOT:../..}
    workspace-directory: ${UDDP_STUDIO_WORKSPACE:../../studio-workspace/statepack}
    settings-directory: ${UDDP_STATEPACK_SETTINGS_DIRECTORY:}
    maker-checker: true
  shaping:
    plugins-dir: ${UDDP_SHAPING_PLUGINS_DIR:plugins}
    approved-plugins-file: ${UDDP_SHAPING_APPROVED_PLUGINS:../../platform/shaping/approved-plugins.yaml}

# Service discovery: register with the registry (discovery-service) and resolve lb:// addresses through it.
eureka:
  client:
    enabled: ${UDDP_EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${UDDP_EUREKA_URL:http://127.0.0.1:8761/eureka/}
  instance:
    prefer-ip-address: true
