# Edge for the onboarding UI: read APIs, review queue, onboarding orchestration.
# Connection settings come only from the environment. The URL defaults to the local database uddp_platform on
# UDDP_POSTGRES_HOST/PORT, the user to the service role uddp_stewardship, and the password to UDDP_STEWARDSHIP_POSTGRES_PASSWORD or,
# when that is unset, UDDP_POSTGRES_PASSWORD. Nothing here is a credential.
spring:
  application:
    name: api-stewardship-service
  datasource:
    url: ${UDDP_STEWARDSHIP_POSTGRES_URL:jdbc:postgresql://${UDDP_POSTGRES_HOST:localhost}:${UDDP_POSTGRES_PORT:5432}/uddp_platform}
    username: ${UDDP_STEWARDSHIP_POSTGRES_USER:uddp_stewardship}
    password: ${UDDP_STEWARDSHIP_POSTGRES_PASSWORD:${UDDP_POSTGRES_PASSWORD:}}
  flyway:
    # Own schema(s) and own history table; this service never touches another schema.
    schemas: stewardship
    default-schema: stewardship
    create-schemas: true
server:
  address: 127.0.0.1
  port: 8106
management:
  endpoints:
    web:
      exposure:
        include: health,info
