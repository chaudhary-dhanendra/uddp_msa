# api-stewardship-service on top of the monolith's application.yml (docs/msa-design.md, section 10, step 5).
# Database: UDDP_POSTGRES_URL=jdbc:postgresql://<host>:<port>/uddp_platform?currentSchema=stewardship with the
# uddp_stewardship role (scripts/msa-db-setup.ps1); the monolith's StartupMigration migrates that schema. Its tables
# for Raw, canonical, matching and Golden data are read models filled from events; it owns stewardship, onboarding,
# security, audit and Studio data.
spring:
  application:
    name: api-stewardship-service
server:
  port: 8106
uddp:
  # The monolith resolves these from common-core/; this service runs from services/api-stewardship-service/.
  repository-root: ${UDDP_REPOSITORY_ROOT:../..}
  platform-directory: ${UDDP_PLATFORM_DIRECTORY:../../platform}
  state-pack-directory: ${UDDP_STATE_PACK_DIRECTORY:../../state-packs}
  events:
    enabled: true
    kafka:
      bootstrap-servers: ${UDDP_KAFKA_BOOTSTRAP_SERVERS:}
  ingestion:
    remote: true
  canonical:
    remote: true
  identity:
    remote: true
  registry:
    remote: true
