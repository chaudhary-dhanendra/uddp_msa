# Tests migrate their own disposable databases; the app must not migrate anything at startup.
uddp.database.migrate-on-startup=false
# YAML packs are explicit fixtures in Spring integration tests only; production defaults to database-only resolution.
uddp.fixture-state-packs-enabled=true
# Tests never read or write the developer's ~/.uddp settings or the repository's Studio folders.
uddp.settings-directory=target/test-settings
uddp.studio.packs-directory=target/test-studio-packs
uddp.studio.workspace-directory=target/test-studio-workspace

# Legacy Spring integration fixtures predate Track C3 release approval.
# Dedicated QualityGateReleaseTest explicitly installs ReleaseService and tests the gated lifecycle.
uddp.operations.release-checkpoint.enabled=false

# Scheme Packs are imported by tests that need them; contexts never import the YAML catalogue on their own (A4).
uddp.schemes.import-catalogue-on-startup=false
