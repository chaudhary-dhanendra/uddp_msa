# The UDDP API gateway: the single public entry; routes the UI's calls to the edge found through discovery.
spring:
  application:
    name: gateway-service
server:
  port: ${UDDP_GATEWAY_PORT:8080}
eureka:
  client:
    enabled: ${UDDP_EUREKA_ENABLED:true}
    # The gateway is reactive (no RestClient builder): the registry client talks through WebClient.
    webclient:
      enabled: true
    service-url:
      defaultZone: ${UDDP_EUREKA_URL:http://127.0.0.1:8761/eureka/}
  instance:
    prefer-ip-address: true
    # The address other services reach this one at; the default suits one machine (services bind 127.0.0.1).
    # Each deployment sets UDDP_INSTANCE_ADDRESS to the host or pod address.
    ip-address: ${UDDP_INSTANCE_ADDRESS:127.0.0.1}
uddp:
  gateway:
    # The edge by its registered name (load balanced); a fixed http:// address works without discovery.
    edge-uri: ${UDDP_GATEWAY_EDGE_URI:lb://edge-service}
    ui-origins: ${UDDP_UI_ORIGINS:http://localhost:4173,http://localhost:5173}

# Observability (docs/observability.md): Prometheus metrics at /actuator/prometheus, traces over OTLP (Tempo), and
# structured JSON logs to a file when UDDP_LOG_DIR is set (collected into Loki).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${UDDP_TRACING_ENABLED:true}
    sampling:
      probability: ${UDDP_TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${UDDP_OTLP_TRACING_URL:http://127.0.0.1:4318/v1/traces}
logging:
  file:
    name: ${UDDP_LOG_DIR:target/logs}/${spring.application.name}.log
  structured:
    format:
      file: ecs
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
