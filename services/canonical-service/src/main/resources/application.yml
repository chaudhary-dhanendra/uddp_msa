# State Pack driven shaping, mapping, conversion and validation; publishes canonical events and the DLQ.
# Connection settings come only from the environment. The URL defaults to the local database uddp_platform on
# UDDP_POSTGRES_HOST/PORT, the user to the service role uddp_canonical, and the password to UDDP_CANONICAL_POSTGRES_PASSWORD or,
# when that is unset, UDDP_POSTGRES_PASSWORD. Nothing here is a credential.
spring:
  application:
    name: canonical-service
  datasource:
    url: ${UDDP_CANONICAL_POSTGRES_URL:jdbc:postgresql://${UDDP_POSTGRES_HOST:localhost}:${UDDP_POSTGRES_PORT:5432}/uddp_platform}
    username: ${UDDP_CANONICAL_POSTGRES_USER:uddp_canonical}
    password: ${UDDP_CANONICAL_POSTGRES_PASSWORD:${UDDP_POSTGRES_PASSWORD:}}
    hikari:
      schema: canonical
  flyway:
    # Own schema(s) and own history table; this service never touches another schema. Its own location, because the
    # monolith's jar (reused for the canonical engine) carries the monolith's migrations under db/migration.
    locations: classpath:db/canonical
    schemas: canonical
    default-schema: canonical
    create-schemas: true
server:
  address: 127.0.0.1
  port: 8102
management:
  endpoints:
    web:
      exposure:
        include: health,info
uddp:
  # Read by the engine's own components (shaping parsers' word lists): the same platform directory.
  platform-directory: ${uddp.canonical.platform-directory}
  kafka:
    # Empty: no consumers and no relay. Set to enable messaging.
    bootstrap-servers: ${UDDP_KAFKA_BOOTSTRAP_SERVERS:}
  canonical:
    # statepack-service: every pack is fetched by version, verified by digest and cached here before it is used.
    statepack-url: ${UDDP_STATEPACK_URL:lb://statepack-service}
    pack-cache: ${UDDP_PACK_CACHE:${java.io.tmpdir}/uddp-canonical-packs}
    # Platform metadata (reference sets, scheme catalogue) and the shaping plugin settings.
    platform-directory: ${UDDP_PLATFORM_DIRECTORY:../../platform}
    shaping-plugins-dir: ${UDDP_SHAPING_PLUGINS_DIR:plugins}
    shaping-approved-plugins: ${UDDP_SHAPING_APPROVED_PLUGINS:../../platform/shaping/approved-plugins.yaml}
    batch-wait: PT10M

# Service discovery: register with the registry (discovery-service) and resolve lb:// addresses through it.
eureka:
  client:
    enabled: ${UDDP_EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${UDDP_EUREKA_URL:http://127.0.0.1:8761/eureka/}
  instance:
    prefer-ip-address: true
