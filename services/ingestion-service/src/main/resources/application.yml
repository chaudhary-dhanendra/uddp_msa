# Generic Hop ingestion and append-only Raw/Landing; publishes raw-record-received.
# Connection settings come only from the environment. The URL defaults to the local database uddp_raw on
# UDDP_POSTGRES_HOST/PORT, the user to the service role uddp_ingestion, and the password to UDDP_INGESTION_POSTGRES_PASSWORD or,
# when that is unset, UDDP_POSTGRES_PASSWORD. Nothing here is a credential.
spring:
  application:
    name: ingestion-service
  datasource:
    url: ${UDDP_INGESTION_POSTGRES_URL:jdbc:postgresql://${UDDP_POSTGRES_HOST:localhost}:${UDDP_POSTGRES_PORT:5432}/uddp_raw}
    username: ${UDDP_INGESTION_POSTGRES_USER:uddp_ingestion}
    password: ${UDDP_INGESTION_POSTGRES_PASSWORD:${UDDP_POSTGRES_PASSWORD:}}
    hikari:
      # Unqualified SQL (and Hop, through RAW_SCHEMA) resolves to the service's own schema.
      schema: ingestion
      data-source-properties:
        # A chunk of raw-record-received events goes to the outbox as multi-row inserts (large batches).
        reWriteBatchedInserts: true
  flyway:
    # Own location: in one JVM (the e2e test) every service's migrations are on the classpath.
    locations: classpath:db/ingestion
    # Own schema(s) and own history table; this service never touches another schema.
    schemas: ingestion
    default-schema: ingestion
    create-schemas: true
server:
  address: 127.0.0.1
  port: 8101
uddp:
  kafka:
    # Empty: no consumers and no relay (the service still serves its API). Set to enable messaging.
    bootstrap-servers: ${UDDP_KAFKA_BOOTSTRAP_SERVERS:}
  ingestion:
    # Root of the repository: delivered files named by a pack's relative location are read from here.
    repository-root: ${UDDP_REPOSITORY_ROOT:../..}
    # This service's generic Hop templates (pipelines/) and Hop metadata (metadata/).
    hop-directory: ${UDDP_HOP_DIRECTORY:hop}
    hop-home: ${HOP_HOME:}
    # Empty: run without a registered Hop project, with this repository's metadata folder (HOP_METADATA_FOLDER).
    hop-project: ${UDDP_HOP_PROJECT:}
    # Files uploaded for ingestion (POST /api/ingestion/files), so callers never share a disk with this service.
    landing-directory: ${UDDP_LANDING_DIRECTORY:${java.io.tmpdir}/uddp-landing}
    # Database-table sources: one entry per connection name a State Pack source names (connectionRef). Credentials
    # come only from the environment, e.g. UDDP_INGESTION_CONNECTIONS_<NAME>_PASSWORD; they never travel on Kafka.
    connections: {}

# Service discovery: register with the registry (discovery-service) and resolve lb:// addresses through it.
eureka:
  client:
    enabled: ${UDDP_EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${UDDP_EUREKA_URL:http://127.0.0.1:8761/eureka/}
  instance:
    prefer-ip-address: true
    # The address other services reach this one at; the default suits one machine (services bind 127.0.0.1).
    # Each deployment sets UDDP_INSTANCE_ADDRESS to the host or pod address.
    ip-address: ${UDDP_INSTANCE_ADDRESS:127.0.0.1}

# Observability (docs/observability.md): Prometheus metrics at /actuator/prometheus, traces over OTLP (Tempo), and
# structured JSON logs to a file when UDDP_LOG_DIR is set (collected into Loki).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${UDDP_TRACING_ENABLED:true}
    sampling:
      probability: ${UDDP_TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${UDDP_OTLP_TRACING_URL:http://127.0.0.1:4318/v1/traces}
logging:
  file:
    name: ${UDDP_LOG_DIR:target/logs}/${spring.application.name}.log
  structured:
    format:
      file: ecs
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
# Service-to-service token (UDDP_INTERNAL_TOKEN): this service's /api/* accepts only callers that send it.
uddp.internal:
  token: ${UDDP_INTERNAL_TOKEN:}
  require-token: true
