# Only the gateway accepts traffic from outside the namespace (the ingress controller); the other services accept it
# from UDDP pods only, plus metrics scrapes from the monitoring namespace. Egress is not restricted here: the services
# reach Kafka, PostgreSQL and the trace collector, whose addresses differ per environment.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uddp-internal
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: ["gateway-service"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: uddp
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uddp-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  policyTypes: ["Ingress"]
  ingress:
    - {}
