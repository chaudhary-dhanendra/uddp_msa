# Prometheus for UDDP: every service is found through the Eureka registry (discovery-service) and scraped at
# /actuator/prometheus, so new services and extra instances are picked up without editing this file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: uddp-services
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://host.docker.internal:8761/eureka
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application
  # The registry itself does not register; scrape it directly.
  - job_name: discovery-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8761"]
        labels:
          application: DISCOVERY-SERVICE
  # Consumer lag per consumer group and topic offsets (dead-letter topics included), read from the broker.
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          application: KAFKA-EXPORTER
