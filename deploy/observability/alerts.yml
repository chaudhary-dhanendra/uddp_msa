# Platform alerts (Prometheus > Alerts); Prometheus sends firing alerts to Alertmanager (alertmanager.yml).
groups:
  - name: uddp-platform
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }} ({{ $labels.instance }}) is not answering its metrics endpoint"
      - alert: HighServerErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of {{ $labels.application }} requests fail with a server error"
      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95, sum by (application, le) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile request time of {{ $labels.application }} is above 2 seconds"
      - alert: HeapAlmostFull
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"})
            / sum by (application) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} uses more than 90% of its heap"

  # Event flow: Kafka consumer lag (kafka-exporter) and the services' transactional outboxes (OutboxRelay metrics).
  - name: uddp-events
    rules:
      - alert: KafkaConsumerLagHigh
        expr: sum by (consumergroup) (kafka_consumergroup_lag_sum) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} is {{ $value }} events behind"
      - alert: KafkaConsumerStalled
        expr: |
          sum by (consumergroup) (kafka_consumergroup_lag_sum) > 0
            and sum by (consumergroup) (increase(kafka_consumergroup_current_offset_sum[10m])) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} has events waiting but has committed nothing for 10 minutes"
      - alert: EventsDeadLettered
        expr: sum by (topic) (increase(kafka_topic_partition_current_offset{topic=~`.+\.dlt\..+`}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Events were parked on {{ $labels.topic }}; inspect and replay them"
      - alert: OutboxBacklogHigh
        expr: max by (application) (uddp_outbox_backlog_events) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} has {{ $value }} outbox events waiting to be published"
      - alert: OutboxStuck
        expr: max by (application) (uddp_outbox_oldest_unpublished_age_seconds) > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The oldest unpublished outbox event of {{ $labels.application }} is over 5 minutes old"
      - alert: OutboxRelayFailing
        expr: sum by (application) (rate(uddp_outbox_relay_failures_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The outbox relay of {{ $labels.application }} keeps failing to publish to Kafka"
