# Platform alerts (see them under Prometheus > Alerts; route them with an Alertmanager in production).
groups:
  - name: uddp-platform
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }} ({{ $labels.instance }}) is not answering its metrics endpoint"
      - alert: HighServerErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of {{ $labels.application }} requests fail with a server error"
      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95, sum by (application, le) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile request time of {{ $labels.application }} is above 2 seconds"
      - alert: HeapAlmostFull
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"})
            / sum by (application) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} uses more than 90% of its heap"
